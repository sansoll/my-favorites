name: 테스트와 배포

on:
  push:
    branches: [main, 'feat/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: 테스트와 빌드
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 타입 검사
        run: npm run typecheck
      - name: 단위·화면 테스트
        run: npm test
      - name: 전체 흐름 테스트 (Playwright)
        run: |
          npx playwright install --with-deps chromium
          npm run e2e
      - name: 빌드
        run: npm run build
      # 작업 브랜치(feat/…)는 본 사이트(main)를 그대로 두고 /preview/에 이 브랜치 버전을 얹습니다.
      # 미리보기는 저장소 이름이 달라서 본 앱 데이터에 영향이 없습니다.
      - name: 미리보기 빌드 (작업 브랜치)
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/feat/')
        run: |
          PREVIEW=1 npx vite build --outDir dist-preview
          git fetch --depth=1 origin main
          git worktree add ../main-src FETCH_HEAD
          (cd ../main-src && npm ci && npx vite build --outDir "$GITHUB_WORKSPACE/dist-main")
          rm -rf dist && mv dist-main dist && mv dist-preview dist/preview
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/feat/'))
        with:
          path: dist

  # 테스트가 하나라도 실패하면 이 단계는 실행되지 않습니다.
  deploy:
    name: GitHub Pages 배포
    needs: test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/feat/'))
    runs-on: ubuntu-latest
    # 배포는 한 번에 하나씩(브랜치가 달라도 같은 사이트라서)
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
